events {}

http {

    ##
    ## UPSTREAMS (balanceamento) – usa os nomes do docker-compose
    ##
    upstream gateway_api {
        server gateway-service:8080;
    }

    upstream quadra_api {
        server quadra:8080;
    }

    upstream auth_api {
        server auth-service:8080;
    }

    upstream reserva_api {
        server reserva:8080;
    }

    upstream pagamento_api {
        server pagamento:8080;
    }

    ##
    ## SERVIDOR PRINCIPAL
    ##
    server {
        listen 80;

        ##
        ## FRONTEND (React) – entregue pelo NGINX
        ##
        root /usr/share/nginx/html;
        index index.html;

        # necessário para SPA (React Router)
        location / {
            try_files $uri /index.html;
        }

        ##
        ## BACKENDS
        ##
        
        # Gateway (padrão /api/)
        location /api/ {
            proxy_pass http://gateway_api/;
            proxy_set_header Host $host;
        }

        # Quadra
        location /quadra/ {
            proxy_pass http://quadra_api/;
            proxy_set_header Host $host;
        }

        # Auth
        location /auth/ {
            proxy_pass http://auth_api/;
            proxy_set_header Host $host;
        }

        # Reserva
        location /reserva/ {
            proxy_pass http://reserva_api/;
            proxy_set_header Host $host;
        }

        # Pagamento
        location /pagamento/ {
            proxy_pass http://pagamento_api/;
            proxy_set_header Host $host;
        }

        ##
        ## HEADERS DE PROXY
        ##
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
