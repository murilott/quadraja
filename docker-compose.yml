version: '3.0'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - app-network
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - app-network
  service-discovery:
    build:
      context: ./service-discovery
    container_name: service-discovery
    ports:
     - "8080:8080"
    volumes:
     - ./service-discovery:/app
     - ~/.m2:/root/.m2
    networks:
     - app-network
  quadra:
    build:
      context: ./quadra
    container_name: quadra
    ports:
     - "8082:8080"
    volumes:
     - ./quadra:/app
     - ~/.m2:/root/.m2
    depends_on:
     - service-discovery
     - rabbitmq
    networks:
     - app-network
  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service
    ports:
     - "8084:8080"
    volumes:
     - ./auth-service:/app
     - ~/.m2:/root/.m2
    depends_on:
     - service-discovery
     - rabbitmq
    networks:
     - app-network
  reserva:
    build:
      context: ./reserva
    container_name: reserva
    ports:
     - "8085:8080"
    volumes:
     - ./reserva:/app
     - ~/.m2:/root/.m2
    depends_on:
     - service-discovery
     - rabbitmq
    networks:
     - app-network
  pagamento:
    build:
      context: ./pagamento
    container_name: pagamento
    ports:
     - "8086:8080"
    volumes:
     - ./pagamento:/app
     - ~/.m2:/root/.m2
    depends_on:
     - service-discovery
     - rabbitmq
    networks:
     - app-network
  gateway-service:
    build:
      context: ./gateway-service
    container_name: gateway-service
    ports:
     - "8083:8080"
    volumes:
     - ./gateway-service:/app
     - ~/.m2:/root/.m2
    depends_on:
     - service-discovery
     - rabbitmq
    networks:
     - app-network
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
     - "80:80"
    volumes:
     - ./nginx.conf:/etc/nginx/nginx.conf:ro
    
    networks:
     - app-network
networks:
  app-network:
    driver: bridge